# ============================================================================
#  ПРАВИЛА СЕРВЕРА. Показываются в книге при входе и по команде /rules.
#  Страницы режутся автоматически. Последняя перед концовкой страница
#  «Доступ к чужому» строится сама из config.yml (раздел access).
#  Держи каждое правило коротким — так книга читается легче.
# ============================================================================
title: "Правила сервера"
author: "Администрация"

welcome:
  - "Добро пожаловать!"
  - "Прочитай правила: это пара минут, которые убережют тебя от наказаний."

sections:
  - title: "Уважение"
    lines:
      - "1.1 Не оскорбляй и не унижай игроков."
      - "1.2 Не провоцируй конфликты и не устраивай травлю."
      - "1.3 Уважай границы, территорию и постройки других."
      - "1.4 Помогай новичкам: мы все с чего-то начинали."

  - title: "Гриферство"
    lines:
      - "2.1 Не ломай и не порти чужие постройки."
      - "2.2 Не поджигай, не взрывай и не разрушай чужие территории."
      - "2.3 Не мешай другим игрокам намеренно."
      - "2.4 Не строй вплотную к чужим базам."

  - title: "Чужие вещи"
    lines:
      - "3.1 Не бери вещи из чужих сундуков без разрешения."
      - "3.2 Не присваивай чужие ресурсы, животных и постройки."
      - "3.3 Взял чужое случайно: верни владельцу."
      - "3.4 Вещи погибшего игрока тоже чужие."

  - title: "Ванильный сервер"
    lines:
      - "4.1 Сервер ванильный: играем честно."
      - "4.2 Запрещены читы, X-Ray и любое нечестное преимущество."
      - "4.3 Нельзя использовать баги и дюпы. Нашёл баг: сообщи админам."
      - "4.4 Можно клиентские улучшения графики (Sodium, шейдеры)."

  - title: "PvP"
    lines:
      - "5.1 Не убивай игроков без их согласия."
      - "5.2 Не уничтожай и не забирай вещи после смерти игрока."
      - "5.3 PvP только там, где это разрешено правилами сервера."
      - "5.4 Режим PvP переключается в /settings."

  - title: "Чат"
    lines:
      - "6.1 Не спамь и не флуди."
      - "6.2 Не рекламируй другие серверы без разрешения админов."
      - "6.3 Не отправляй запрещённый и оскорбительный контент."
      - "6.4 Не выдавай себя за администратора."

  - title: "Администрация"
    lines:
      - "7.1 Соблюдай решения администрации."
      - "7.2 О нарушениях сообщай админам, не мсти сам."
      - "7.3 Незнание правил не освобождает от ответственности."

  - title: "Наказания"
    lines:
      - "8.1 За нарушения: предупреждение › мут или кик › бан."
      - "8.2 Гриферство, читы и дюпы могут привести к бану сразу."
      - "8.3 Оспорить наказание можно у администрации."

outro:
  - "Играя на сервере, ты принимаешь эти правила."
  - "Приятной игры!"
